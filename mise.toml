[tools]
node = "24"
pi = "0.87.0"

[env]
PI_CODING_AGENT_DIR = "{{config_root}}/agent"
PI_SKIP_VERSION_CHECK = "1"
PI_TELEMETRY = "0"

[hooks]
postinstall = "npm ci && npm rebuild better-sqlite3 --ignore-scripts=false"

[tasks.setup]
description = "Install pinned tools and locked npm deps"
run = "mise install"

[tasks.typecheck]
description = "Typecheck extensions and tests"
dir = "{{config_root}}"
run = "npx tsc --noEmit"

[tasks.test]
description = "Run config tests"
dir = "{{config_root}}"
run = "npx vitest run"

[tasks.coverage]
description = "Run the git tool tests with per-file coverage thresholds"
dir = "{{config_root}}"
run = "npx vitest run tests/exec.test.ts tests/git-commit.test.ts tests/git-gh.test.ts tests/git-worktree.test.ts --coverage"

[tasks.lint]
description = "Lint extensions and tests with oxlint"
dir = "{{config_root}}"
run = "npx oxlint --config .oxlintrc.jsonc"

[tasks.format]
description = "Format extensions and tests with oxfmt"
dir = "{{config_root}}"
run = 'npx oxfmt --write .'

[tasks."format:check"]
description = "Check formatting of extensions and tests"
dir = "{{config_root}}"
run = 'npx oxfmt --check .'

[tasks.snapshot]
description = "Regenerate test snapshots"
dir = "{{config_root}}"
env = { UPDATE_SNAPSHOTS = "1" }
run = 'npx vitest run $(rg -l matchSnapshot tests -g "*.test.ts" | tr "\n" " ")'

[tasks.golden]
description = "Regenerate sdd golden fixtures"
dir = "{{config_root}}"
env = { UPDATE_GOLDENS = "1" }
run = "npx vitest run tests/jinja-golden.test.ts"

[tasks.drift]
description = "Fail if pi changed tracked config at runtime"
dir = "{{config_root}}"
run = 'out=$(git status --porcelain -- agent/); [ -z "$out" ] || { echo "$out" >&2; exit 1; }'

[tasks.reset]
description = "Discard runtime writes pi made to tracked config"
dir = "{{config_root}}"
run = "git checkout -- agent/"

[tasks.check]
description = "Typecheck, lint, format-check, test, coverage, and check drift"
run = [
  { task = "typecheck" },
  { task = "lint" },
  { task = "format:check" },
  { task = "test" },
  { task = "coverage" },
  { task = "drift" },
]
